name: Repair Godot parse error

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - name: Repair typed frontier variables
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/game_runtime.gd')
          s = p.read_text(encoding='utf-8')
          s2 = s.replace('var group_average := (level + max(1, level - 1) + level + 1) / 3.0', 'var group_average: float = (level + max(1, level - 1) + level + 1) / 3.0')
          s2 = s2.replace('var average := (level + group_average) / 2.0', 'var average: float = (level + group_average) / 2.0')
          if s2 == s:
              print('No parse-error replacements needed.')
          else:
              p.write_text(s2, encoding='utf-8')
              print('Applied typed frontier variables fix.')
          PY
      - name: Commit repair
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git add scripts/game_runtime.gd
          git commit -m 'Fix Godot frontier type inference'
          git push
