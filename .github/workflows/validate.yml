name: Validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate-godot:
    name: Validate Godot project
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Godot 4.4.1
        uses: solarlabyrinth/action-setup-godot@v3
        with:
          version: 4.4.1-stable
          export-templates: true
      - name: Validate project files and autoloads
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . --editor --quit 2>&1 | tee godot-editor-validation.log
          if grep -Eq 'SCRIPT ERROR:|Failed to load script|Failed to create an autoload|Parse Error:' godot-editor-validation.log; then
            echo 'Godot project validation failed.'
            exit 1
          fi
      - name: Run main scene smoke test
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . --quit-after 3 2>&1 | tee godot-runtime-validation.log
          if grep -Eq 'SCRIPT ERROR:|Failed to load script|Failed to create an autoload|Parse Error:|ERROR: Cannot get class|Invalid call' godot-runtime-validation.log; then
            echo 'Godot runtime smoke test failed.'
            exit 1
          fi

  validate-server:
    name: Validate Python server
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile server
        run: python -m compileall -q server.py