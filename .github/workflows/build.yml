name: Build

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  package-source:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Package project source
        run: |
          mkdir -p dist
          zip -r "dist/Infinite-Ascension-${GITHUB_REF_NAME}.zip" . \
            -x '.git/*' '.godot/*' 'dist/*'
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*.zip
