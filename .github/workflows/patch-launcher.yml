name: Patch Launcher UI

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate Windows launcher UI
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("launcher/windows/Program.cs")
          s = path.read_text(encoding="utf-8")

          required = [
              "private readonly Button stop = new();",
              "private readonly Button settings = new();",
              "private Process? gameProcess;",
              "private bool autoUpdate = true;",
              "private bool uploadLogs = true;",
              "private bool confirmClose = true;",
              "private void StopGame()",
              "private void ShowSettings()",
              "private void LoadSettings()",
              "private void SaveSettings()",
          ]

          missing = [item for item in required if item not in s]
          if missing:
              print("Launcher validation failed. Missing:")
              for item in missing:
                  print(f"- {item}")
              raise SystemExit(1)

          print("Launcher UI validation passed.")
          PY
