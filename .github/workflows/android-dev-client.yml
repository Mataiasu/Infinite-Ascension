name: Android Dev Client

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android local PC dev client APK
    runs-on: ubuntu-latest
    env:
      GODOT_ANDROID_KEYSTORE_DEBUG_PATH: /home/runner/.android/debug.keystore
      GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
      GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.1"
      - name: Create debug keystore
        shell: bash
        run: |
          mkdir -p "$HOME/.android"
          keytool -genkeypair -keystore "$HOME/.android/debug.keystore" -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
      - name: Setup Godot 4.4.1
        uses: solarlabyrinth/action-setup-godot@v3
        with:
          version: 4.4.1-stable
          export-templates: true
      - name: Validate Dev Client GDScript
        working-directory: dev/android-client
        shell: bash
        run: |
          set -o pipefail
          mapfile -t scripts < <(find . -type f -name '*.gd' -not -path './.godot/*' | sort)
          failed=0
          for script in "${scripts[@]}"; do
            echo "=== Checking ${script} ==="
            if ! godot --headless --path . --check-only --script "${script}"; then
              failed=1
            fi
          done
          exit "$failed"
      - name: Configure Godot Android editor settings
        shell: bash
        run: |
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$HOME/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF
      - name: Create isolated Android export preset
        working-directory: dev/android-client
        shell: bash
        run: |
          cat > export_presets.cfg <<'EOF'
          [preset.0]
          name="Android Dev Client"
          platform="Android"
          runnable=true
          advanced_options=false
          dedicated_server=false
          custom_features="dev_client"
          version="4.4"
          export_filter="all_resources"
          include_filter=""
          exclude_filter=""
          encrypt_pck=false
          encrypt_directory=false
          script_export_mode=1

          [preset.0.options]
          custom_template/debug=""
          custom_template/release=""
          architectures/arm64-v8a=true
          architectures/armeabi-v7a=false
          architectures/x86=false
          architectures/x86_64=false
          package/unique_name="com.mataiasu.infiniteascension.dev"
          package/name="Infinite Ascension Dev Client"
          package/signed=false
          application/config/name="Infinite Ascension Dev Client"
          application/run/main_scene="res://AndroidDevLauncher.tscn"
          permissions/internet=true
          screen/immersive_mode=true
          EOF
      - name: Export Android Dev Client
        working-directory: dev/android-client
        shell: bash
        run: |
          mkdir -p ../../dist
          godot --headless --path . --export-debug "Android Dev Client" ../../dist/Infinite-Ascension-Android-Dev-unsigned.apk
          BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.1"
          "$BUILD_TOOLS/zipalign" -p -f 4 ../../dist/Infinite-Ascension-Android-Dev-unsigned.apk ../../dist/Infinite-Ascension-Android-Dev.apk
          "$BUILD_TOOLS/apksigner" sign --ks "$HOME/.android/debug.keystore" --ks-key-alias androiddebugkey --ks-pass pass:android --key-pass pass:android --out ../../dist/Infinite-Ascension-Android-Dev.apk ../../dist/Infinite-Ascension-Android-Dev.apk
          "$BUILD_TOOLS/apksigner" verify --verbose ../../dist/Infinite-Ascension-Android-Dev.apk
          rm ../../dist/Infinite-Ascension-Android-Dev-unsigned.apk
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Infinite-Ascension-Android-Dev
          path: dist/Infinite-Ascension-Android-Dev.apk
          retention-days: 14
      - name: Publish APK to rolling dev release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view android-dev >/dev/null 2>&1 || gh release create android-dev --title "Infinite Ascension Android Dev Client" --notes "Rolling Android PC dev client build."
          gh release upload android-dev dist/Infinite-Ascension-Android-Dev.apk --clobber
