name: Build and Publish

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: infinite-ascension-main-build
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  game:
    name: Build Windows + Linux game
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Godot 4.4.1
        uses: solarlabyrinth/action-setup-godot@v3
        with:
          version: 4.4.1-stable
          export-templates: true
      - name: Validate project
        run: godot --headless --path . --editor --quit
      - name: Export Windows
        run: |
          mkdir -p dist/windows
          godot --headless --path . --export-release "Windows Desktop" dist/windows/InfiniteAscension.exe
      - name: Export Linux
        run: |
          mkdir -p dist/linux
          godot --headless --path . --export-release "Linux/X11" dist/linux/InfiniteAscension.x86_64
          chmod +x dist/linux/InfiniteAscension.x86_64
      - name: Add build version
        run: |
          printf '{"build":%s,"commit":"%s"}\n' "${GITHUB_RUN_NUMBER}" "${GITHUB_SHA}" > dist/windows/version.json
          cp dist/windows/version.json dist/linux/version.json
      - name: Package Windows
        run: |
          cd dist/windows
          zip -r ../Infinite-Ascension-Windows.zip .
      - name: Package Linux
        run: |
          cd dist/linux
          zip -r ../Infinite-Ascension-Linux.zip .
      - name: Upload game packages
        uses: actions/upload-artifact@v4
        with:
          name: game-packages
          path: dist/Infinite-Ascension-*.zip
          retention-days: 7

  game-android:
    name: Build Android test launcher APK
    runs-on: ubuntu-latest
    env:
      GODOT_ANDROID_KEYSTORE_DEBUG_PATH: /home/runner/.android/debug.keystore
      GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
      GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.1" "cmdline-tools;latest"
      - name: Verify Android toolchain
        shell: bash
        run: |
          test -x "$ANDROID_HOME/platform-tools/adb"
          test -x "$ANDROID_HOME/build-tools/35.0.1/zipalign"
          test -x "$ANDROID_HOME/build-tools/35.0.1/apksigner"
          test -f "$ANDROID_HOME/platforms/android-35/android.jar"
          echo "Android SDK: $ANDROID_HOME"
          echo "Java SDK: $JAVA_HOME"
          "$ANDROID_HOME/platform-tools/adb" version
          "$ANDROID_HOME/build-tools/35.0.1/apksigner" version
      - name: Setup Android debug keystore
        shell: bash
        run: |
          mkdir -p "$HOME/.android"
          keytool -genkeypair \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android \
            -keypass android \
            -alias androiddebugkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
      - name: Setup Godot 4.4.1
        uses: solarlabyrinth/action-setup-godot@v3
        with:
          version: 4.4.1-stable
          export-templates: true
      - name: Initialize Godot editor settings
        run: godot --headless --path . --editor --quit
      - name: Configure Godot Android editor settings
        shell: bash
        run: |
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$HOME/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF
          echo "--- Godot Android settings ---"
          cat "$HOME/.config/godot/editor_settings-4.tres"
      - name: Export Android APK
        shell: bash
        run: |
          mkdir -p dist/android
          godot --headless --path . --export-debug "Android" dist/android/Infinite-Ascension-Android-unsigned.apk
      - name: Align and sign Android APK
        shell: bash
        run: |
          BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.1"
          "$BUILD_TOOLS/zipalign" -p -f 4 \
            dist/android/Infinite-Ascension-Android-unsigned.apk \
            dist/android/Infinite-Ascension-Android.apk
          "$BUILD_TOOLS/apksigner" sign \
            --ks "$HOME/.android/debug.keystore" \
            --ks-key-alias androiddebugkey \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out dist/android/Infinite-Ascension-Android.apk \
            dist/android/Infinite-Ascension-Android.apk
          "$BUILD_TOOLS/apksigner" verify --verbose dist/android/Infinite-Ascension-Android.apk
          rm -f dist/android/Infinite-Ascension-Android-unsigned.apk
      - name: Add Android build info
        run: |
          printf '{"build":%s,"commit":"%s","platform":"android"}\n' "${GITHUB_RUN_NUMBER}" "${GITHUB_SHA}" > dist/android/version.json
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: android-test-apk
          path: dist/android/Infinite-Ascension-Android.apk
          retention-days: 7

  launcher-windows:
    name: Build native Windows launcher
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Publish native launcher
        run: dotnet publish launcher/windows/InfiniteAscensionLauncher.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=None -p:DebugSymbols=false -o dist/launcher-windows
      - name: Package Windows launcher
        shell: pwsh
        run: Compress-Archive -Path dist/launcher-windows/* -DestinationPath dist/Infinite-Ascension-Launcher-Windows.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: launcher-windows
          path: dist/Infinite-Ascension-Launcher-Windows.zip
          retention-days: 7

  launcher-linux:
    name: Build Linux launcher
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r launcher/requirements.txt
      - name: Build launcher (onedir)
        run: pyinstaller --clean --noconfirm --onedir --name Infinite-Ascension-Launcher launcher/launcher.py
      - name: Package launcher
        run: |
          chmod +x dist/Infinite-Ascension-Launcher/Infinite-Ascension-Launcher
          cd dist
          zip -r Infinite-Ascension-Launcher-Linux.zip Infinite-Ascension-Launcher
      - uses: actions/upload-artifact@v4
        with:
          name: launcher-linux
          path: dist/Infinite-Ascension-Launcher-Linux.zip
          retention-days: 7

  publish:
    name: Publish latest release
    needs: [game, game-android, launcher-windows, launcher-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: '*'
          path: release
          merge-multiple: true
      - name: Prepare manifest
        shell: bash
        run: |
          WIN_SHA=$(sha256sum release/Infinite-Ascension-Windows.zip | cut -d ' ' -f1)
          LIN_SHA=$(sha256sum release/Infinite-Ascension-Linux.zip | cut -d ' ' -f1)
          ANDROID_SHA=$(sha256sum release/Infinite-Ascension-Android.apk | cut -d ' ' -f1)
          WIN_LAUNCHER_SHA=$(sha256sum release/Infinite-Ascension-Launcher-Windows.zip | cut -d ' ' -f1)
          LIN_LAUNCHER_SHA=$(sha256sum release/Infinite-Ascension-Launcher-Linux.zip | cut -d ' ' -f1)
          WIN_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/latest/Infinite-Ascension-Windows.zip"
          LIN_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/latest/Infinite-Ascension-Linux.zip"
          ANDROID_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/latest/Infinite-Ascension-Android.apk"
          WIN_LAUNCHER_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/latest/Infinite-Ascension-Launcher-Windows.zip"
          LIN_LAUNCHER_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/latest/Infinite-Ascension-Launcher-Linux.zip"
          cat > release/manifest.json <<EOF
          {
            "build": ${GITHUB_RUN_NUMBER},
            "commit": "${GITHUB_SHA}",
            "assets": {
              "windows": {"name": "Infinite-Ascension-Windows.zip", "url": "${WIN_URL}", "sha256": "${WIN_SHA}"},
              "linux": {"name": "Infinite-Ascension-Linux.zip", "url": "${LIN_URL}", "sha256": "${LIN_SHA}"},
              "android": {"name": "Infinite-Ascension-Android.apk", "url": "${ANDROID_URL}", "sha256": "${ANDROID_SHA}"},
              "launcher_windows": {"name": "Infinite-Ascension-Launcher-Windows.zip", "url": "${WIN_LAUNCHER_URL}", "sha256": "${WIN_LAUNCHER_SHA}"},
              "launcher_linux": {"name": "Infinite-Ascension-Launcher-Linux.zip", "url": "${LIN_LAUNCHER_URL}", "sha256": "${LIN_LAUNCHER_SHA}"}
            }
          }
          EOF
      - name: Replace latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
          gh release create latest \
            --repo "$GITHUB_REPOSITORY" \
            --title "Infinite Ascension — Latest build #${GITHUB_RUN_NUMBER}" \
            --notes "Build automatique. Windows, Linux et APK Android de test. Le launcher Android ouvre le client Android ; il ne lance pas un .exe Windows à distance." \
            release/Infinite-Ascension-Windows.zip \
            release/Infinite-Ascension-Linux.zip \
            release/Infinite-Ascension-Android.apk \
            release/Infinite-Ascension-Launcher-Windows.zip \
            release/Infinite-Ascension-Launcher-Linux.zip \
            release/manifest.json
